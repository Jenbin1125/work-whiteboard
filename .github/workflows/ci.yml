name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Standing project security invariants (see CLAUDE.md / session practice):
      # no innerHTML, no service_role key, no native confirm()/alert(), and
      # the design_documents table must never be referenced from the
      # frontend. Comment-only lines are excluded since these terms are
      # legitimately documented in code comments explaining the invariant
      # itself — only real usage in actual code should fail the build.
      - name: Security invariant checks
        run: |
          check() {
            local label="$1"
            local pattern="$2"
            local hits
            hits=$(grep -rnE "$pattern" src/ | grep -vE '^[^:]+:[0-9]+:\s*//' || true)
            if [ -n "$hits" ]; then
              echo "::error::Security invariant violated ($label):"
              echo "$hits"
              exit 1
            fi
            echo "OK: no $label found outside comments"
          }
          check "innerHTML" "innerHTML"
          check "service_role key" "service_role"
          check "native confirm()/alert()" "confirm\(|alert\("
          check "design_documents reference" "design_documents"
